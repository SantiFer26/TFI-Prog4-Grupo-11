<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Inicio</title>
</head>

<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav>
            <ul>                
                <li>
                    <a href="empleado-sistemas-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="empleado-sistemas-categorias.html">Categorías</a>
                </li>
                <li>
                    <a href="empleado-sistemas-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="../../../index.html" class="active" aria-current="page" href="#">Salir</a>
                </li>
            </ul>
        </nav>
        <div class="right-container">
            <main>
                <div class="container text-center">                    
                    <div class="row">
                        <div class="col-auto me-auto">
                            <h3>Categorías</h3>
                        </div>
                        <div class="col-4">
                            <div class="input-group">
                                <input type="text" id="input-id" class="form-control" placeholder="Ingrese el ID de la categoria">
                                <button type="button" id="btn-busqueda" class="btn btn-primary mt-auto w-auto">Buscar</button>
                            </div>
                        </div>
                        <div class="col-auto">
                            <button id="btnNuevaCategoria" type="button" class="btn btn-primary mt-auto w-auto">Nueva categoría</button>
                        </div>
                    </div>
                
                
                    <table class="table">
                        <thead>
                            <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla_categorias"></tbody>
                    </table>
                </div>    
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <div class="modal fade" id="modalEliminarCategoria" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Eliminar categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="textoModal"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="botonEliminar" class="btn btn-primary">Eliminar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalEditarCategoria" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <label for="inputEditarCategoria" class="form-label">Descripción</label>
                <input type="text" id="inputEditarCategoria" class="form-control">
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="botonGuardarCambios" class="btn btn-primary">Guardar cambios</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="modalNuevaCategoria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Nueva categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label for="inputNuevaCategoria" class="form-label">Descripción</label>
        <input type="text" id="inputNuevaCategoria" class="form-control">
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="botonCrearCategoria" class="btn btn-primary">Crear</button>
      </div>

    </div>
  </div>
</div>



    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="miToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body">
                    <p id="textoToast"></p>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/pages/empleado-sistemas/empleado-sistemas-categorias.js"></script>
</body>

</html>
