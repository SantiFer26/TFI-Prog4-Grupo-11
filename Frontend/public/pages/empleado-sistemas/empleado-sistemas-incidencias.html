<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Inicio</title>
</head>

<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav class="main-nav">
            <ul>                
                <li>
                    <a href="empleado-sistemas-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="empleado-sistemas-categorias.html">Categorías</a>
                </li>
                <li>
                    <a href="empleado-sistemas-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="./empleado-sistemas.html" class="active" aria-current="page">Atrás</a>
                </li>
            </ul>
        </nav>
        <nav class="secondary-nav">
            <ul>
                <li>
                    <a href="../auth/login.html" class="active" aria-current="page" id="cerrar-sesion">Cerrar Sesión</a>
                </li>
            </ul>
        </nav>
        <div class="right-container">
            <main>
                <div class="container text-center">                    
                    <div class="row">
                        <div class="col-auto me-auto">
                            <h3>Incidencias</h3>
                        </div>
                    </div>
                
                
                    <table class="table">
                        <thead>
                            <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Articulo</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Creada el</th>
                            <th scope="col">Prioridad</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody> 
                    </table>
                    <!-- Panel resolución -->
                        <div id="panel-resolucion" style="display:none;" class="mt-3">
                            <h4>Resolución de la incidencia</h4>

                            <textarea
                                id="input-resolucion"
                                class="form-control"
                                rows="4"
                                placeholder="Describa la resolución...">
                            </textarea>

                            <br>

                            <button
                                id="btn-guardar-resolucion"
                                class="btn btn-success">
                                Guardar
                            </button>
                        </div>
                    </div>    
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="miToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body">
                    <p id="textoToast"></p>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./empleado-sistemas-incidencias.js"></script>
</body>

</html>
