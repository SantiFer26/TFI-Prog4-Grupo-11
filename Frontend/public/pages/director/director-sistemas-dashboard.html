<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Inicio</title>
</head>

<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav>
            <ul>
                <li>
                    <a href="director-sistemas-incidencias.html">Incidencias</a>
                </li>
            </ul>
        </nav>
        <nav class="secondary-nav">
            <ul>
                <li>
                    <a href="../auth/login.html" class="active" aria-current="page" id="cerrar-sesion">Cerrar Sesión</a>
                </li>
            </ul>
        </nav>
        <div class="container-director flex-wrap justify-content-center">
            <main class="text-center">
                <h1 id="h1-inicio-sistemas"></h1>
                <p id="p-inicio-sistemas" class="fw-semibold"></p>
                <div>                    
                    <div class="card-group">
                        <div class="card card-amarillo-oscuro text-white me-3">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h5 class="card-title fs-3 fw-semibold">Pendientes</h5>
                                <h2 class="card-title display-4 fw-semibold" id="total_pendientes">38</h2>
                                <p class="card-text">
                                    <a class="btn btn-link link-light link-offset-2 link-underline-opacity-50 
                                    link-underline-opacity-100-hover fs-5 p-0" id="inc-pendientes" 
                                    href="director-sistemas-incidencias.html?estado=pendiente">
                                        Ver más
                                    </a>
                                </p>
                            </div>
                        </div>
                        <div class="card text-bg-danger me-3">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h5 class="card-title fs-3 fw-semibold">Pendientes Prioritarias</h5>
                                <h2 class="card-title display-4 fw-semibold" id="total_prioritarias">29</h2>
                                <p class="card-text">
                                    <a class="btn btn-link link-light link-offset-2 link-underline-opacity-50 
                                    link-underline-opacity-100-hover fs-5 p-0" id="inc-prioritarias" 
                                    href="director-sistemas-incidencias.html?estado=pendiente&prioridad=1">
                                        Ver más
                                    </a>
                                </p>
                            </div>
                        </div>
                        <div class="card text-bg-secondary me-3">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h5 class="card-title fs-3 fw-semibold">Canceladas</h5>
                                <h2 class="card-title display-4 fw-semibold" id="total_canceladas">35</h2>
                                <p class="card-text">
                                    <a class="btn btn-link link-light link-offset-2 link-underline-opacity-50 
                                    link-underline-opacity-100-hover fs-5 p-0" id="inc-canceladas" 
                                    href="director-sistemas-incidencias.html?estado=cancelada">
                                        Ver más
                                    </a>
                                </p>
                            </div>
                        </div>
                        <div class="card text-bg-info text-white">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <h5 class="card-title fs-3 fw-semibold">Totales</h5>
                                <h2 class="card-title display-4 fw-semibold" id="incidencias_totales">100</h2>
                                <p class="card-text">
                                    <a class="btn btn-link link-light link-offset-2 link-underline-opacity-50 
                                    link-underline-opacity-100-hover fs-5 p-0" id="inc-totales" 
                                    href="director-sistemas-incidencias.html">
                                        Ver más
                                    </a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="miToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body">
                    <p id="textoToast"></p>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./director-sistemas-dashboard.js"></script>
</body>

</html>
