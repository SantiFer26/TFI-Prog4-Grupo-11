<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Inicio</title>
</head>

<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav>
            <ul>   
                <li>
                    <a href="director-sistemas-dashboard.html">Volver al dashboard</a>
                </li>
            </ul>
        </nav>
        <nav class="secondary-nav">
            <ul>
                <li>
                    <a href="../auth/login.html" class="active" aria-current="page" id="cerrar-sesion">Cerrar Sesión</a>
                </li>
            </ul>
        </nav>
        <div class="right-container">
            <main>
                <div class="container text-center" id="container-tabla-director">
                    <div id="contenedor-tabla" class="d-none mt-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <h3 id="titulo-tabla-director"></h3>
                            <button id="btn-reporte-pdf" class="btn btn-primary btn-sm">
                                <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
                            </button>
                        </div>
                        <table class="table table-hover table-responsive">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha Creación</th>
                                    <th>Prioridad</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla"></tbody>
                        </table>
                    </div>
                </div>  
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="miToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body">
                    <p id="textoToast"></p>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./director-sistemas-incidencias.js"></script>
</body>

</html>
