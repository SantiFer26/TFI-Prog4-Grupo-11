<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Inicio</title>
</head>

<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="./empleado-municipal-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="./empleado-municipal-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="./empleado-municipal.html" class="active" aria-current="page" href="#">Atrás</a>
                </li>
            </ul>
        </nav>
        <nav class="secondary-nav">
            <ul>
                <li>
                    <a href="../auth/login.html" class="active" aria-current="page" id="cerrar-sesion">Cerrar Sesión</a>
                </li>
            </ul>
        </nav>
        <div class="right-container">
            <main>
                <div class="container text-center">                    
                    <div class="row">
                        <div class="col-auto me-auto">
                            <h3>Mis Incidencias</h3>
                        </div>
                        <div class="col-auto">
                            <a href="./empleado-municipal-articulos.html" class="btn btn-primary mt-auto w-auto">Nueva</a>
                        </div>
                    </div>
                
                    <table class="table">
                        <thead>
                            <tr>
                            <th scope="col">Número</th>
                            <th scope="col">Articulo</th>
                            <th scope="col">Creada el </th>
                            <th scope="col">Prioridad</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                    </table>
                </div>    
            </main>
            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <div class="modal fade" id="modalCancelarIncidencia" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label for="inputCancelarIncidencia" class="form-label">Motivo de cancelación:</label>
                    <input type="text" id="inputCancelarIncidencia" class="form-control">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver atrás</button>
                    <button type="button" id="btnCancelarIncidencia" class="btn btn-primary">Cancelar Incidencia</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="miToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body">
                    <p id="textoToast"></p>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./empleado-municipal-incidencias.js"></script>

</body>

</html>
