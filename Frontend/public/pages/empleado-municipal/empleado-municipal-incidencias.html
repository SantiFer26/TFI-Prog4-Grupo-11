<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav>
            <ul>
                <li>
                    <a href="./empleado-municipal-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="./empleado-municipal-incidencias.html">Incidencias</a>

        <div class="right-container">
            <main>
                <div class="container text-center">                    
                    <div class="row">
                        <div class="col-auto me-auto">
                            <h3>Mis Incidencias</h3>
                        </div>
                        <div class="col-auto">
                            <a href="./nueva-incidencia.html?from=incidencias"><button type="button" class="btn btn-primary mt-auto w-auto">Nueva</button></a>
                        </div>
                    </div>
                
                
                    <table class="table">
                        <thead>
                            <tr>
                            <th scope="col">Número</th>
                            <th scope="col">Creada el </th>
                            <th scope="col">Prioridad</th>
                            <th scope="col">Estado</th>

                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>

            <!-- <footer>
            </footer> -->
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
   <script>
    async function cargarIncidencias() {
    try {
        const response = await fetch("http://localhost:3000/api/v1/incidencias");
        const incidencias = await response.json();

        const tbody = document.querySelector("tbody");
        tbody.innerHTML = "";

        incidencias.forEach(inc => {

            // Traducir estado
            let estadoTexto = "";
            switch (inc.id_estado) {
                case 1: estadoTexto = "Pendiente"; break;
                case 2: estadoTexto = "En proceso"; break;
                case 3: estadoTexto = "Finalizada"; break;
                default: estadoTexto = "Desconocido";
            }

            const fila = document.createElement("tr");
            fila.innerHTML = `
                <td>${inc.id_incidencia}</td>
                <td>${new Date(inc.creado).toLocaleDateString()}</td>
                <td>${inc.prioridad}</td>
                <td>${estadoTexto}</td>
                <td>
                    <button class="btn btn-danger btn-sm">Cancelar</button>
                </td>
            `;
            tbody.appendChild(fila);
        });

    } catch (error) {
        console.error("Error cargando incidencias:", error);
    }
}

cargarIncidencias();
</script>


</body>

</html>
