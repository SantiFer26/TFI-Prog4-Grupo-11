<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva incidencia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="incidencia-container">
      <nav>
        <ul>
          <li>
            <a href="./empleado-municipal-articulos.html">Artículos</a>
          </li>
          <li>
            <a href="./empleado-municipal-incidencias.html">Incidencias</a>
          </li>
          <li>
            <a href="../../../index.html" class="active" aria-current="page" href="#">Salir</a>
          </li>
        </ul>
      </nav>
      <main> 
        <div class= "container-form">
          <div class="titulo">Incidencia</div>
          <form>
              <div class="group-form">
                <span>Articulo</span>
                <select name="opciones-articulo" id="opciones-articulo">
                  <option value="articulo1">Articulo 1</option>
                  <option value="articulo2">Articulo 2</option>
                  <option value="articulo3">Articulo 3</option>
                  <option value="articulo4">Articulo 4</option>
                </select>
              </div>
              <div class="group-form">
                <span>Prioridad</span>
                <select name="opciones-prioridad" id="opciones-prioridad">
                  <option value=1>Baja</option>
                  <option value=2>Media</option>
                  <option value=3>Alta</option>
                </select>
              </div>
              <div class="group-form">
                <span>Descripción</span>
                <input type="text" placeholder="Ingrese una breve descripción">
              </div>
              <div class="button">
                <input type="button" value="Registrar">
              </div>
          </form>
        </div>
      </main>
    </div>
</body>
</html>
