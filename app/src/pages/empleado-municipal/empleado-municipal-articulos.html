<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../src/css/style.css">
    <title>Inicio</title>
</head>

<body>
    <header>
        <img class="logo" src="../../../assets/logo-muni.png" alt="Logo Muni">
    </header>
    <div class="main-container">
        <nav>
            <ul>
                <li>
                    <a href="./empleado-municipal-articulos.html">Artículos</a>
                </li>
                <li>
                    <a href="./empleado-municipal-incidencias.html">Incidencias</a>
                </li>
                <li>
                    <a href="../../../index.html" class="active" aria-current="page" href="#">Salir</a>
                </li>

            </ul>
        </nav>
        <div class="right-container">
            <main>
                <div class="container text-center">                    
                    <div class="row">
                        <div class="col-auto me-auto">
                            <h3>Artículos</h3>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-auto me-auto mt-2">
                            <h4>Seleccione el artículo que presenta fallas: </h4>
                        </div>
                        <div class="col-4">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Buscar artículo">
                                <button type="button" class="btn btn-primary mt-auto w-auto">Buscar</button>
                            </div>
                        </div>
                        <div class="col-auto">
                            <label class="visually-hidden" for="autoSizingSelect">Preference</label>
                            <select class="form-select" id="autoSizingSelect">
                                <option selected>Ordenar por...</option>
                                <option value="1">Categoria: A-Z</option>
                                <option value="2">Descripción: A-Z</option>
                                <option value="3">Descripción: Z-A</option>
                            </select>
                        </div>
                    </div>
                
                
                    <table class="table table-hover">
                        <thead>
                            <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Descripción</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <tr>
                                <th scope="row">1000</th>
                                <td>Periféricos</td>
                                <td>Teclado</td>
                            </tr>
                            <tr>
                                <th scope="row">1002</th>
                                <td>Periféricos</td>
                                <td>Mouse</td>
                            </tr>
                            <tr>
                                <th scope="row">1033</th>
                                <td>Almacenamiento</td>
                                <td>Disco Rígido</td>
                            </tr>
                        </tbody>
                    </table>
                </div>    
            </main>
            <!--<footer>
                <p class="footer">© Municipalidad de Concordia 2026 - Sistema de Gestión de Incidencias</p>
                <p class="footer">v1.0</p>
            </footer> -->
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
